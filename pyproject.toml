[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocpp-projectMTLSN"
version = "2.1.0"
description = "Production-Ready OCPP 1.6J EV Charge Point Simulator & Hardware Controller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
pi = [
    "rpi-hardware-pwm>=0.2.0",
    "adafruit-circuitpython-ads1x15",
    "smbus2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ocpp-charger = "ocpp_charger.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
